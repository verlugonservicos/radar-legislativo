name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint e testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependências
        run: |
          pip install -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (formatação)
        run: ruff format --check .
      - name: Pytest (sem integração)
        run: pytest -m "not integration" --cov=radar --cov-report=term-missing
      # A partir do M1: python -m radar catalog check --offline

  banco:
    name: db init em PostgreSQL + pgvector
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Banco descartável do próprio runner (não é segredo).
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependências
        run: |
          pip install -r requirements-dev.txt
          pip install -e . --no-deps
      - name: db init (duas vezes, para provar idempotência)
        run: |
          python -m radar db init
          python -m radar db init
      - name: Testes de integração
        run: pytest -m integration

  infra:
    name: Scripts da VPS (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n e shellcheck
        run: |
          for f in infra/vps/*.sh; do bash -n "$f"; done
          shellcheck --severity=warning infra/vps/*.sh

  segredos:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
