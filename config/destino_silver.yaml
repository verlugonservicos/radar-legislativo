# Destino de cada tabela Bronze na Silver (SPEC V3, seção 8.2).
# Todos os campos vão para a Bronze; este mapa diz para quais tabelas silver.* cada
# endpoint alimenta. "conformada" = a tabela Silver une mais de uma origem Bronze.
# Usado por `radar catalog dicionario` para gerar docs/dicionario_de_dados.md.
padrao_referencias: referencias
destinos:
  referencias_uf: [referencias, ufs]
  legislaturas: [legislaturas]
  legislaturas_detalhe: [legislaturas]
  legislaturas_lideres: [legislaturas_lideres]
  legislaturas_mesa: [legislaturas_mesa]
  partidos: [partidos]
  partidos_detalhe: [partidos]
  partidos_lideres: [partidos_lideres]
  partidos_membros: [partidos_membros]
  blocos: [blocos]
  blocos_detalhe: [blocos]
  blocos_partidos: [blocos_partidos]
  deputados: [deputados]
  deputados_detalhe: [deputados]
  deputados_despesas: [despesas]
  deputados_discursos: [discursos]
  deputados_eventos: [eventos_deputados (conformada)]
  deputados_frentes: [deputados_frentes (conformada)]
  deputados_historico: [deputados_historico]
  deputados_mandatos_externos: [deputados_mandatos_externos]
  deputados_ocupacoes: [deputados_ocupacoes]
  deputados_orgaos: [deputados_orgaos (conformada), orgaos_membros (conformada)]
  deputados_profissoes: [deputados_profissoes]
  orgaos: [orgaos]
  orgaos_detalhe: [orgaos]
  orgaos_eventos: [eventos_orgaos (conformada)]
  orgaos_membros: [orgaos_membros (conformada), deputados_orgaos (conformada)]
  orgaos_votacoes: [votacoes_proposicoes (conformada)]
  eventos: [eventos, eventos_orgaos (conformada)]
  eventos_detalhe: [eventos]
  eventos_deputados: [eventos_deputados (conformada)]
  eventos_orgaos: [eventos_orgaos (conformada)]
  eventos_pauta: [eventos_pauta]
  eventos_votacoes: [votacoes_proposicoes (conformada)]
  frentes: [frentes]
  frentes_detalhe: [frentes]
  frentes_membros: [frentes_membros, deputados_frentes (conformada)]
  grupos: [grupos]
  grupos_detalhe: [grupos]
  grupos_historico: [grupos_historico]
  grupos_membros: [grupos_membros]
  proposicoes: [proposicoes]
  proposicoes_detalhe: [proposicoes]
  proposicoes_autores: [proposicoes_autores]
  proposicoes_relacionadas: [proposicoes_relacionadas]
  proposicoes_temas: [proposicoes_temas]
  proposicoes_tramitacoes: [proposicoes_tramitacoes]
  proposicoes_votacoes: [votacoes_proposicoes (conformada)]
  votacoes: [votacoes, votacoes_proposicoes (conformada)]
  votacoes_detalhe: [votacoes, votacoes_proposicoes (conformada)]
  votacoes_orientacoes: [votacoes_orientacoes]
  votacoes_votos: [votos]
