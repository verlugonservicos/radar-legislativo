  grupo: votacoes
  tipo: detalhe
  paginado: false
  frequencia: diaria
  chave:
  - id
  ids:
    de: &id006
    - votacoes
    - eventos_votacoes
    - orgaos_votacoes
    - proposicoes_votacoes
    campo: id
    filtro: janela
- nome: votacoes_orientacoes
  path: /votacoes/{id}/orientacoes
  grupo: votacoes
  tipo: subrecurso
  paginado: false
  frequencia: diaria
  chave:
  - '{id_pai}'
  - siglaPartidoBloco
  ids:
    de: *id006
    campo: id
    filtro: janela
- nome: votacoes_votos
  path: /votacoes/{id}/votos
  grupo: votacoes
  tipo: subrecurso
  paginado: false
  frequencia: diaria
  chave:
  - '{id_pai}'
  - deputado_.id
  ids:
    de: *id006
    campo: id
    filtro: janela
  observacao: 'Sem paginação: lista completa numa resposta (confirmado: centenas de registros, só link self).'
