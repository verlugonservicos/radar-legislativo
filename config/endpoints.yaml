  - tipoDiscurso
  - urlTexto
  janela: &id002
    tipo: periodo
    params: &id004
      dataInicio: '{inicio}'
      dataFim: '{fim}'
  ids:
    de: deputados
    campo: id
    filtro: ultima_execucao
  observacao: Sem datas a API retorna 7 dias.
