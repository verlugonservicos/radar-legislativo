- nome: deputados_despesas
  path: /deputados/{id}/despesas
  grupo: deputados
  tipo: subrecurso
  paginado: true
  frequencia: diaria
  chave:
  - '{id_pai}'
  - ano
  - mes
  - codDocumento
  - numDocumento
  - parcela
  - valorDocumento
  params:
    ordem: ASC
    ordenarPor: dataDocumento
  janela:
    tipo: mensal
    params:
      ano: '{ano}'
      mes: '{mes}'
    reprocessar_meses: 3
  ids:
    de: deputados
    campo: id
    filtro: ultima_execucao
  observacao: Sem datas a API retorna 6 meses.
- nome: deputados_discursos
  path: /deputados/{id}/discursos
