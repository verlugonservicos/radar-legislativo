# =============================================================================
# pg-gateway — acesso ao PostgreSQL do Supabase sem expor a porta 5432 (decisão D1)
#
# Encaminha para db:5432 (rede supabase_default) e publica SOMENTE em:
#   127.0.0.1:5433   → túnel SSH da máquina de desenvolvimento e DBeaver
#   172.18.0.1:5433  → gateway docker_gwbridge, por onde os serviços do Swarm (n8n,
#                      stack radar) alcançam o banco (mesmo padrão do Supavisor)
# Não altera nenhum arquivo do Supabase.
#
# Subir, NA VPS:  docker compose -f docker-compose.gateway.yml -p radar-gateway up -d
# =============================================================================
name: radar-gateway

services:
  pg-gateway:
    # Mesma imagem já usada na VPS pelo supabase_proxy, fixada por digest.
    image: alpine/socat@sha256:e8a6e8868a8e6e01d9c2c321a8f8d4474d2d741d962462e5c5a124a8e66a0055
    container_name: radar-pg-gateway
    command: ["TCP-LISTEN:5432,fork,reuseaddr", "TCP:db:5432"]
    ports:
      - "127.0.0.1:5433:5432"
      - "172.18.0.1:5433:5432"
    networks: [supabase]
    restart: unless-stopped
    mem_limit: 64m
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

networks:
  supabase:
    external: true
    name: supabase_default
